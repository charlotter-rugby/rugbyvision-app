<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RugbyVision 7s | Executive Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --export-btn: #3b82f6;
      --export-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 28px;
      background: var(--bg-dark);
      color: var(--text-main);
      max-width: 1000px;
      margin: auto;
    }
    h2 { color: var(--accent); margin-bottom: 4px; }
    p.subtitle { color: var(--text-muted); margin-top: 0; font-size: 14px; margin-bottom: 20px; }
    input, textarea, button {
      width: 100%;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 8px;
      box-sizing: border-box;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 14px;
    }
    button {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    
    /* Export Button Styling */
    #exportBtn {
      background: var(--export-btn);
      width: auto;
      padding: 10px 20px;
      margin-top: 15px;
      display: none; /* Hidden until analysis finishes */
    }
    #exportBtn:hover { background: var(--export-hover); }

    #status { color: var(--accent); text-align: center; font-weight: 600; margin: 10px 0; }
    #result {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 10px;
      margin-top: 20px;
      border: 1px solid var(--border);
      display: none;
    }
    #result h4 {
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-top: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px 8px;
      text-align: center;
    }
    th { background: #0f172a; color: var(--accent); }
    tr:nth-child(even) { background: #162032; }
    ul { padding-left: 20px; line-height: 1.6; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>

  <h2>RugbyVision 7s</h2>
  <p class="subtitle">Automated Video Performance Dossier</p>

  <input type="text" id="videoLink" placeholder="Paste YouTube Link Here">
  <textarea id="roster" rows="4" placeholder="Enter Target Roster (e.g., 13 | Charlotte Ducote | Fly Half | Yellow Cleats)"></textarea>

  <button id="analyzeBtn" onclick="runAnalysis()">RUN TAPE ANALYSIS</button>
  <div id="status"></div>
  
  <div id="result"></div>
  <button id="exportBtn" onclick="exportCSV()">Download CSV Scorecard</button>

  <script>
    async function runAnalysis() {
      const videoUrl = document.getElementById('videoLink').value;
      const targetPlayers = document.getElementById('roster').value;
      const statusDiv = document.getElementById('status');
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('analyzeBtn');
      const exportBtn = document.getElementById('exportBtn');

      if (!videoUrl || !targetPlayers) {
        alert("Please provide both match footage and a roster.");
        return;
      }

      btn.disabled = true;
      exportBtn.style.display = "none";
      statusDiv.innerText = "Analyzing match tape against 4-Pillar Rubric...";
      resultDiv.style.display = "none";

      try {
        const response = await fetch('/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ videoUrl, targetPlayers })
        });

        const data = await response.json();
        btn.disabled = false;
        statusDiv.innerText = "";

        if (data.output) {
          resultDiv.innerHTML = marked.parse(data.output);
          resultDiv.style.display = "block";
          exportBtn.style.display = "inline-block"; // Show export button
        } else {
          resultDiv.innerHTML = `<p style="color: #ef4444;">Error: ${data.error || 'Failed to process tape'}</p>`;
          resultDiv.style.display = "block";
        }
      } catch (err) {
        btn.disabled = false;
        statusDiv.innerText = "";
        resultDiv.innerHTML = `<p style="color: #ef4444;">System Error: ${err.message}</p>`;
        resultDiv.style.display = "block";
      }
    }

    // Function to extract the rendered HTML table and download it as a CSV
    function exportCSV() {
      const table = document.querySelector('table');
      if (!table) {
        alert("No scorecard table found to export.");
        return;
      }
      
      let csv = [];
      const rows = table.querySelectorAll('tr');
      
      for (let i = 0; i < rows.length; i++) {
        let row = [], cols = rows[i].querySelectorAll('td, th');
        for (let j = 0; j < cols.length; j++) {
          let data = cols[j].innerText.replace(/"/g, '""');
          row.push('"' + data + '"');
        }
        csv.push(row.join(','));
      }
      
      const csvFile = new Blob([csv.join('\n')], {type: 'text/csv'});
      const downloadLink = document.createElement('a');
      downloadLink.download = 'RugbyVision_KPI_Scorecard.csv';
      downloadLink.href = window.URL.createObjectURL(csvFile);
      downloadLink.style.display = 'none';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }
  </script>
</body>
</html>
